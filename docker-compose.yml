services:
  databreach:
    build: .
    ports:
      - "3078:3078"
    restart: unless-stopped
    shm_size: "256m"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3078/health', timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
