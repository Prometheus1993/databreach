# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "databreach_server"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/databreach_server
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("databreach_server.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("databreach_server.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

    <script type="application/javascript">
    (function () {
        // ---------- gaze smoothing ----------
        const GAZE_WINDOW = 6;
        const gazeBuf = [];
        function smoothGaze(x, y) {
            gazeBuf.push([x, y]);
            if (gazeBuf.length > GAZE_WINDOW) gazeBuf.shift();
            let sx = 0, sy = 0;
            for (const [a, b] of gazeBuf) { sx += a; sy += b; }
            return [sx / gazeBuf.length, sy / gazeBuf.length];
        }

        // ---------- heatmap ----------
        const heatmap = document.getElementById("heatmap");
        const hctx = heatmap.getContext("2d");
        function sizeHeatmap() {
            heatmap.width = window.innerWidth;
            heatmap.height = window.innerHeight;
        }
        sizeHeatmap();
        window.addEventListener("resize", sizeHeatmap);

        // additive radial blob — accumulating samples make hotspots brighter
        function addHeatPoint(x, y) {
            const r = 36;
            const grad = hctx.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0.0, "rgba(255, 60, 0, 0.18)");
            grad.addColorStop(0.5, "rgba(255, 200, 0, 0.06)");
            grad.addColorStop(1.0, "rgba(0, 80, 255, 0.00)");
            hctx.globalCompositeOperation = "lighter";
            hctx.fillStyle = grad;
            hctx.beginPath();
            hctx.arc(x, y, r, 0, Math.PI * 2);
            hctx.fill();
        }
        function clearHeatmap() {
            hctx.clearRect(0, 0, heatmap.width, heatmap.height);
        }

        // ---------- recording ----------
        // each sample: { t: ms since session start, x, y, vw, vh }
        const samples = [];
        let sessionStartMs = 0;
        let sessionStartIso = "";

        // ---------- gaze loop ----------
        const gazeDot = document.getElementById("gaze-dot");
        const statsEl = document.getElementById("stats");
        let lastGazeAt = 0;
        let gazeDotVisible = true;
        let heatmapVisible = false;

        function fmtElapsed(ms) {
            const s = Math.floor(ms / 1000);
            const mm = String(Math.floor(s / 60)).padStart(2, "0");
            const ss = String(s % 60).padStart(2, "0");
            return `${mm}:${ss}`;
        }
        let lastStatsUpdate = 0;
        function updateStats(now) {
            if (now - lastStatsUpdate < 250) return;
            lastStatsUpdate = now;
            const elapsed = sessionStartMs ? now - sessionStartMs : 0;
            statsEl.textContent = `SAMPLES: ${samples.length} · ${fmtElapsed(elapsed)}`;
        }

        function onGaze(data) {
            if (!data) return;
            const now = performance.now();
            lastGazeAt = now;
            const [x, y] = smoothGaze(data.x, data.y);

            if (gazeDotVisible) {
                gazeDot.style.display = "block";
                gazeDot.style.left = x + "px";
                gazeDot.style.top  = y + "px";
            }

            // record
            if (sessionStartMs) {
                samples.push({
                    t: Math.round(now - sessionStartMs),
                    x: Math.round(x),
                    y: Math.round(y),
                    vw: window.innerWidth,
                    vh: window.innerHeight,
                });
                addHeatPoint(x, y);
                updateStats(now);
            }
        }

        // ---------- export ----------
        function exportCSV() {
            if (samples.length === 0) {
                alert("No samples recorded yet.");
                return;
            }
            const header = "session_start_iso,t_ms,x_px,y_px,viewport_w,viewport_h\n";
            const rows = samples.map(s =>
                `${sessionStartIso},${s.t},${s.x},${s.y},${s.vw},${s.vh}`
            ).join("\n");
            const blob = new Blob([header + rows + "\n"], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const stamp = sessionStartIso.replace(/[:.]/g, "-");
            a.href = url;
            a.download = `databreach_gaze_${stamp}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // calibration
        const calibEl = document.getElementById("calib");
        const calibCancelBtn = document.getElementById("calib-cancel");
        let calibActive = false;

        function openCalibration() {
            calibActive = true;
            gazeDot.style.display = "none";
            calibEl.querySelectorAll(".calib-pt").forEach((n) => n.remove());
            const positions = [];
            for (const py of [0.1, 0.5, 0.9]) for (const px of [0.1, 0.5, 0.9]) positions.push([px, py]);
            const CLICKS = 5;
            let remaining = positions.length;
            positions.forEach(([px, py]) => {
                const dot = document.createElement("div");
                dot.className = "calib-pt";
                dot.style.left = (px * 100) + "%";
                dot.style.top  = (py * 100) + "%";
                let clicks = 0;
                dot.textContent = CLICKS;
                dot.addEventListener("click", () => {
                    clicks++;
                    dot.textContent = Math.max(0, CLICKS - clicks);
                    if (clicks >= CLICKS) {
                        dot.classList.add("done");
                        dot.textContent = "✓";
                        dot.style.pointerEvents = "none";
                        if (--remaining === 0) closeCalibration();
                    }
                });
                calibEl.appendChild(dot);
            });
            calibEl.classList.add("show");
        }
        function closeCalibration() {
            calibEl.classList.remove("show");
            calibActive = false;
            if (gazeDotVisible) gazeDot.style.display = "block";
        }
        calibCancelBtn.addEventListener("click", closeCalibration);

        // ---------- toolbar ----------
        const toggleBtn  = document.getElementById("eye-toggle");
        const calibBtn   = document.getElementById("eye-calibrate");
        const dotBtn     = document.getElementById("eye-dot");
        const heatmapBtn = document.getElementById("eye-heatmap");
        const clearBtn   = document.getElementById("eye-clear");
        const exportBtn  = document.getElementById("eye-export");

        let webgazerReady = false;
        let webgazerOn = false;

        function setActionButtonsEnabled(on) {
            calibBtn.disabled = !on;
            dotBtn.disabled = !on;
            heatmapBtn.disabled = !on;
            clearBtn.disabled = !on;
            exportBtn.disabled = !on;
        }

        async function startWebgazer() {
            if (typeof webgazer === "undefined") {
                alert("WebGazer failed to load — check your internet connection.");
                return;
            }
            toggleBtn.textContent = "STARTING…";
            toggleBtn.disabled = true;
            try {
                webgazer.params.showVideoPreview = true;
                webgazer.params.showFaceOverlay = false;
                webgazer.params.showFaceFeedbackBox = false;
                webgazer.showPredictionPoints(false);
                await webgazer
                    .setRegression("ridge")
                    .setGazeListener((data) => onGaze(data))
                    .begin();
                webgazerReady = true;
                webgazerOn = true;
                sessionStartMs = performance.now();
                sessionStartIso = new Date().toISOString();
                toggleBtn.textContent = "DISABLE EYE TRACKING";
                toggleBtn.classList.add("active");
                toggleBtn.disabled = false;
                statsEl.classList.add("show");
                setActionButtonsEnabled(true);
                setTimeout(() => { if (webgazerOn && samples.length < 5) openCalibration(); }, 800);
            } catch (e) {
                console.error(e);
                alert("Could not access webcam. Allow camera permission and try again.");
                toggleBtn.textContent = "ENABLE EYE TRACKING";
                toggleBtn.disabled = false;
            }
        }
        function stopWebgazer() {
            if (!webgazerReady) return;
            webgazerOn = false;
            try { webgazer.pause(); webgazer.showVideoPreview(false); } catch (_) {}
            gazeDot.style.display = "none";
            toggleBtn.textContent = "ENABLE EYE TRACKING";
            toggleBtn.classList.remove("active");
            // keep export+clear enabled so the user can still grab the data
            calibBtn.disabled = true;
            dotBtn.disabled = true;
            heatmapBtn.disabled = true;
        }

        toggleBtn.addEventListener("click", () => {
            if (!webgazerReady) startWebgazer();
            else if (webgazerOn) stopWebgazer();
            else {
                webgazer.resume(); webgazer.showVideoPreview(true);
                webgazerOn = true;
                if (!sessionStartMs) {
                    sessionStartMs = performance.now();
                    sessionStartIso = new Date().toISOString();
                }
                toggleBtn.textContent = "DISABLE EYE TRACKING";
                toggleBtn.classList.add("active");
                setActionButtonsEnabled(true);
            }
        });
        calibBtn.addEventListener("click", openCalibration);
        dotBtn.addEventListener("click", () => {
            gazeDotVisible = !gazeDotVisible;
            dotBtn.textContent = gazeDotVisible ? "HIDE GAZE DOT" : "SHOW GAZE DOT";
            if (!gazeDotVisible) gazeDot.style.display = "none";
        });
        heatmapBtn.addEventListener("click", () => {
            heatmapVisible = !heatmapVisible;
            heatmap.classList.toggle("show", heatmapVisible);
            heatmapBtn.textContent = heatmapVisible ? "HIDE HEATMAP" : "SHOW HEATMAP";
        });
        clearBtn.addEventListener("click", () => {
            if (!confirm("Clear all recorded gaze data?")) return;
            samples.length = 0;
            clearHeatmap();
            sessionStartMs = performance.now();
            sessionStartIso = new Date().toISOString();
            updateStats(performance.now());
        });
        exportBtn.addEventListener("click", exportCSV);

        // preload webgazer in the background
        (function loadWebgazer() {
            if (typeof webgazer !== "undefined") return;
            const s = document.createElement("script");
            s.src = "https://webgazer.cs.brown.edu/webgazer.js";
            s.onerror = () => console.warn("webgazer load failed");
            document.head.appendChild(s);
        })();
    })();
    </script>

    function debug() {
        // allow to gain access to dev tools from js console
        // but only on desktop. difficult to reach when in iframe
        python.config.debug = true
        custom_onload(false)
        Module.PyRun_SimpleString("shell.uptime()")
        window_resize()
    }

    function info_inline(data){
        document.getElementById("info").innerHTML = data
    }

    function info_online(url) {
        // display info about current APK
        fetch( url /*, options */)
            .then((response) => response.text())
            .then((html) => {
                info_inline(html);
        })
        .catch((error) => {
            console.warn(error);
        });
    }

    function frame_online(url) {
        window.frames["iframe"].location = url;
    }

    </script>
