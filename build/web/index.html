async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "databreach_server"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/databreach_server
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("databreach_server.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("databreach_server.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play

    <script type="application/javascript">
    (function () {
        const KEY_MAP = {
            "ArrowUp":    { code: "ArrowUp",    keyCode: 38 },
            "ArrowDown":  { code: "ArrowDown",  keyCode: 40 },
            "ArrowLeft":  { code: "ArrowLeft",  keyCode: 37 },
            "ArrowRight": { code: "ArrowRight", keyCode: 39 },
            " ":          { code: "Space",      keyCode: 32 },
            "Enter":      { code: "Enter",      keyCode: 13 },
            "Escape":     { code: "Escape",     keyCode: 27 },
        };

        // dispatch synthetic key events to pygame's canvas (SDL2 listens on document/canvas)
        function dispatchKey(key, down) {
            const meta = KEY_MAP[key];
            if (!meta) return;
            const targets = [
                document.getElementById("canvas"),
                document.body,
                document,
                window,
            ].filter(Boolean);
            for (const t of targets) {
                const ev = new KeyboardEvent(down ? "keydown" : "keyup", {
                    key, code: meta.code, keyCode: meta.keyCode, which: meta.keyCode,
                    bubbles: true, cancelable: true,
                });
                t.dispatchEvent(ev);
            }
        }

        const heldKeys = new Set();
        function pressKey(key)   { if (heldKeys.has(key)) return; heldKeys.add(key);    dispatchKey(key, true); }
        function releaseKey(key) { if (!heldKeys.has(key)) return; heldKeys.delete(key); dispatchKey(key, false); }
        function releaseAll()    { for (const k of [...heldKeys]) releaseKey(k); }
        function tapKey(key)     { dispatchKey(key, true); setTimeout(() => dispatchKey(key, false), 80); }

        // gaze smoothing
        const GAZE_WINDOW = 8;
        const gazeBuf = [];
        function smoothGaze(x, y) {
            gazeBuf.push([x, y]);
            if (gazeBuf.length > GAZE_WINDOW) gazeBuf.shift();
            let sx = 0, sy = 0;
            for (const [a, b] of gazeBuf) { sx += a; sy += b; }
            return [sx / gazeBuf.length, sy / gazeBuf.length];
        }

        // arrow zones — full viewport, 40% dead zone in center
        function zoneForGaze(gx, gy) {
            const w = window.innerWidth, h = window.innerHeight;
            if (gx < 0 || gx > w || gy < 0 || gy > h) return null;
            const nx = gx / w, ny = gy / h;
            const dx = nx - 0.5, dy = ny - 0.5;
            const DZ = 0.20;
            if (Math.abs(dx) < DZ && Math.abs(dy) < DZ) return "center";
            if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? "ArrowLeft" : "ArrowRight";
            return dy < 0 ? "ArrowUp" : "ArrowDown";
        }

        // dwell buttons
        const DWELL_MS = 900;
        const dwellBtns = [...document.querySelectorAll(".dwell-btn")];
        const dwellState = new Map(dwellBtns.map((b) => [b, { entered: 0, fired: false }]));
        function updateDwell(gx, gy, now) {
            for (const btn of dwellBtns) {
                const r = btn.getBoundingClientRect();
                const inside = gx >= r.left && gx <= r.right && gy >= r.top && gy <= r.bottom;
                const st = dwellState.get(btn);
                const fillEl = btn.querySelector(".fill");
                if (inside) {
                    if (st.entered === 0) { st.entered = now; st.fired = false; }
                    const elapsed = now - st.entered;
                    fillEl.style.width = Math.min(100, (elapsed / DWELL_MS) * 100) + "%";
                    btn.classList.add("armed");
                    if (!st.fired && elapsed >= DWELL_MS) {
                        st.fired = true;
                        tapKey(btn.dataset.key);
                        fillEl.style.width = "100%";
                        setTimeout(() => { fillEl.style.width = "0%"; st.entered = 0; }, 200);
                    }
                } else {
                    st.entered = 0;
                    st.fired = false;
                    fillEl.style.width = "0%";
                    btn.classList.remove("armed");
                }
            }
        }

        // gaze loop
        const gazeDot = document.getElementById("gaze-dot");
        const ZONE_HOLD_MS = 120;
        let currentArrow = null;
        let candidateArrow = null;
        let candidateSince = 0;
        let lastGazeAt = 0;
        let gazeDotVisible = true;

        function onGaze(data) {
            if (!data) {
                if (performance.now() - lastGazeAt > 250) {
                    releaseAll();
                    currentArrow = candidateArrow = null;
                }
                return;
            }
            lastGazeAt = performance.now();
            const [x, y] = smoothGaze(data.x, data.y);

            if (gazeDotVisible) {
                gazeDot.style.display = "block";
                gazeDot.style.left = x + "px";
                gazeDot.style.top  = y + "px";
            }

            if (!calibActive) updateDwell(x, y, lastGazeAt);

            const zone = zoneForGaze(x, y);
            const next = (zone && zone !== "center" && KEY_MAP[zone]) ? zone : null;
            if (next !== candidateArrow) { candidateArrow = next; candidateSince = lastGazeAt; }
            const stable = lastGazeAt - candidateSince >= ZONE_HOLD_MS;
            const target = stable ? candidateArrow : currentArrow;
            if (target !== currentArrow) {
                if (currentArrow) releaseKey(currentArrow);
                if (target) pressKey(target);
                currentArrow = target;
            }
        }

        // calibration
        const calibEl = document.getElementById("calib");
        const calibCancelBtn = document.getElementById("calib-cancel");
        let calibActive = false;

        function openCalibration() {
            calibActive = true;
            releaseAll();
            gazeDot.style.display = "none";
            calibEl.querySelectorAll(".calib-pt").forEach((n) => n.remove());
            const positions = [];
            for (const py of [0.1, 0.5, 0.9]) for (const px of [0.1, 0.5, 0.9]) positions.push([px, py]);
            const CLICKS = 5;
            let remaining = positions.length;
            positions.forEach(([px, py]) => {
                const dot = document.createElement("div");
                dot.className = "calib-pt";
                dot.style.left = (px * 100) + "%";
                dot.style.top  = (py * 100) + "%";
                let clicks = 0;
                dot.textContent = CLICKS;
                dot.addEventListener("click", () => {
                    clicks++;
                    dot.textContent = Math.max(0, CLICKS - clicks);
                    if (clicks >= CLICKS) {
                        dot.classList.add("done");
                        dot.textContent = "✓";
                        dot.style.pointerEvents = "none";
                        if (--remaining === 0) closeCalibration();
                    }
                });
                calibEl.appendChild(dot);
            });
            calibEl.classList.add("show");
        }
        function closeCalibration() {
            calibEl.classList.remove("show");
            calibActive = false;
            if (gazeDotVisible) gazeDot.style.display = "block";
        }
        calibCancelBtn.addEventListener("click", closeCalibration);

        // toolbar
        const toggleBtn = document.getElementById("eye-toggle");
        const calibBtn  = document.getElementById("eye-calibrate");
        const debugBtn  = document.getElementById("eye-debug");
        const dwellBack   = document.getElementById("dwell-back");
        const dwellSelect = document.getElementById("dwell-select");

        let webgazerReady = false;
        let webgazerOn = false;

        function showDwellButtons(show) {
            dwellBack.classList.toggle("show", show);
            dwellSelect.classList.toggle("show", show);
        }

        async function startWebgazer() {
            if (typeof webgazer === "undefined") {
                alert("WebGazer failed to load — check your internet connection.");
                return;
            }
            toggleBtn.textContent = "STARTING…";
            toggleBtn.disabled = true;
            try {
                webgazer.params.showVideoPreview = true;
                webgazer.params.showFaceOverlay = false;
                webgazer.params.showFaceFeedbackBox = false;
                webgazer.showPredictionPoints(false);
                await webgazer
                    .setRegression("ridge")
                    .setGazeListener((data) => onGaze(data))
                    .begin();
                webgazerReady = true;
                webgazerOn = true;
                toggleBtn.textContent = "DISABLE EYE TRACKING";
                toggleBtn.classList.add("active");
                toggleBtn.disabled = false;
                calibBtn.disabled = false;
                debugBtn.disabled = false;
                showDwellButtons(true);
                setTimeout(() => { if (webgazerOn && gazeBuf.length < 5) openCalibration(); }, 800);
            } catch (e) {
                console.error(e);
                alert("Could not access webcam. Allow camera permission and try again.");
                toggleBtn.textContent = "ENABLE EYE TRACKING";
                toggleBtn.disabled = false;
            }
        }
        function stopWebgazer() {
            if (!webgazerReady) return;
            webgazerOn = false;
            try { webgazer.pause(); webgazer.showVideoPreview(false); } catch (_) {}
            releaseAll();
            gazeDot.style.display = "none";
            toggleBtn.textContent = "ENABLE EYE TRACKING";
            toggleBtn.classList.remove("active");
            calibBtn.disabled = true;
            debugBtn.disabled = true;
            showDwellButtons(false);
        }

        toggleBtn.addEventListener("click", () => {
            if (!webgazerReady) startWebgazer();
            else if (webgazerOn) stopWebgazer();
            else {
                webgazer.resume(); webgazer.showVideoPreview(true);
                webgazerOn = true;
                toggleBtn.textContent = "DISABLE EYE TRACKING";
                toggleBtn.classList.add("active");
                calibBtn.disabled = false; debugBtn.disabled = false;
                showDwellButtons(true);
            }
        });
        calibBtn.addEventListener("click", openCalibration);
        debugBtn.addEventListener("click", () => {
            gazeDotVisible = !gazeDotVisible;
            debugBtn.textContent = gazeDotVisible ? "HIDE GAZE DOT" : "SHOW GAZE DOT";
            if (!gazeDotVisible) gazeDot.style.display = "none";
        });

        // preload webgazer in the background
        (function loadWebgazer() {
            if (typeof webgazer !== "undefined") return;
            const s = document.createElement("script");
            s.src = "https://webgazer.cs.brown.edu/webgazer.js";
            s.onerror = () => console.warn("webgazer load failed");
            document.head.appendChild(s);
        })();
    })();
    </script>
