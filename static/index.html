<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DATA BREACH</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      color: #00e600;
      user-select: none;
    }

    #status {
      font-size: 12px;
      letter-spacing: 3px;
      opacity: 0.6;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    #status.error  { color: #e62020; opacity: 1; }
    #status.ok     { color: #00e600; opacity: 0.7; }
    #status.busy   { color: #e6e600; opacity: 1; }

    #game {
      display: block;
      border: 1px solid #003c00;
      outline: none;
      cursor: none;
      max-width: 100vw;
      max-height: calc(100vh - 70px);
      aspect-ratio: 1024 / 768;
      width: min(1024px, 100vw);
    }

    #game:focus { border-color: #00e600; }

    #hint {
      font-size: 10px;
      letter-spacing: 2px;
      opacity: 0.3;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="status" class="error">[ CONNECTING... ]</div>
  <canvas id="game" width="1024" height="768" tabindex="0"></canvas>
  <div id="hint">CLICK CANVAS · ARROW KEYS / ENTER / SPACE / ESC</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx    = canvas.getContext('2d');
    const status = document.getElementById('status');

    const proto  = location.protocol === 'https:' ? 'wss' : 'ws';
    const WS_URL = `${proto}://${location.host}/ws`;

    let ws = null;

    function setStatus(msg, cls = 'ok') {
      status.textContent = `[ ${msg} ]`;
      status.className   = cls;
    }

    function connect() {
      ws = new WebSocket(WS_URL);
      ws.binaryType = 'blob';

      ws.onopen = () => {
        setStatus('CONNECTED — CLICK TO FOCUS', 'ok');
        canvas.focus();
      };

      ws.onmessage = (e) => {
        if (e.data instanceof Blob) {
          const url = URL.createObjectURL(e.data);
          const img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
          };
          img.src = url;
        } else {
          try {
            const msg = JSON.parse(e.data);
            if (msg.type === 'busy') {
              setStatus('GAME IN USE — RETRYING IN 5s', 'busy');
              setTimeout(connect, 5000);
            }
          } catch (_) {}
        }
      };

      ws.onclose = () => {
        setStatus('DISCONNECTED — RECONNECTING...', 'error');
        setTimeout(connect, 3000);
      };

      ws.onerror = () => ws.close();
    }

    // Keys the browser should pass through to the game
    const PASS_KEYS = new Set([
      'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
      'Enter', ' ', 'Escape', 'Backspace', 'Delete',
      'F1', 'F2', 'F3',
      ...'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split(''),
    ]);

    function send(type, key) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type, key }));
      }
    }

    canvas.addEventListener('keydown', (e) => {
      if (PASS_KEYS.has(e.key)) { e.preventDefault(); send('keydown', e.key); }
    });

    canvas.addEventListener('keyup', (e) => {
      if (PASS_KEYS.has(e.key)) { e.preventDefault(); send('keyup', e.key); }
    });

    // Re-focus canvas on click so keys keep working after switching tabs
    canvas.addEventListener('click', () => canvas.focus());

    // Show a "click to focus" overlay when canvas loses focus
    canvas.addEventListener('blur', () => setStatus('CLICK CANVAS TO RESUME INPUT', 'busy'));
    canvas.addEventListener('focus', () => setStatus('CONNECTED', 'ok'));

    connect();
  </script>
</body>
</html>
