<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DATA BREACH</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #050505;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: "Courier New", Courier, monospace;
        color: #00e600;
        user-select: none;
        overflow: hidden;
      }

      #status {
        font-size: 12px;
        letter-spacing: 3px;
        opacity: 0.6;
        margin-bottom: 10px;
        text-transform: uppercase;
      }

      #frame {
        width: min(1024px, 100vw);
        height: min(768px, calc(100vw * 768 / 1024));
        max-height: calc(100vh - 70px);
        border: 1px solid #003c00;
        background: #000;
        display: block;
      }

      #hint {
        font-size: 10px;
        letter-spacing: 2px;
        opacity: 0.3;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="status">[ CLICK GAME TO CAPTURE KEYS · 10 MIN SESSION LIMIT ]</div>
    <iframe
      id="frame"
      src="/novnc/vnc_lite.html?autoconnect=1&amp;path=ws&amp;resize=scale&amp;reconnect=1&amp;reconnect_delay=3000"
      allow="fullscreen"
      scrolling="no"
    ></iframe>
    <div id="hint">ARROW KEYS · ENTER · SPACE · ESC</div>
    <script>
      const frame = document.getElementById("frame");
      const NAV_KEYS = [
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        " ",
        "Spacebar",
        "PageUp",
        "PageDown",
        "Home",
        "End",
      ];

      window.addEventListener(
        "keydown",
        (e) => {
          if (NAV_KEYS.includes(e.key)) e.preventDefault();
        },
        { passive: false },
      );

      function focusCanvas() {
        try {
          const doc = frame.contentDocument || frame.contentWindow.document;
          if (!doc) return;
          doc.documentElement.style.overflow = "hidden";
          if (doc.body) doc.body.style.overflow = "hidden";
          const canvas = doc.querySelector("canvas");
          if (canvas) {
            canvas.setAttribute("tabindex", "0");
            canvas.focus();
          }
        } catch (_) {}
      }

      function hookIframe() {
        try {
          const doc = frame.contentDocument || frame.contentWindow.document;
          if (!doc) return;
          doc.addEventListener(
            "keydown",
            (e) => {
              if (NAV_KEYS.includes(e.key)) e.preventDefault();
            },
            { capture: true, passive: false },
          );
        } catch (_) {}
        focusCanvas();
      }

      frame.addEventListener("load", () => {
        hookIframe();
        // noVNC can swap in its canvas slightly after load; retry briefly.
        let tries = 0;
        const retry = setInterval(() => {
          focusCanvas();
          if (++tries > 10) clearInterval(retry);
        }, 200);
      });

      const grab = () => focusCanvas();
      document.addEventListener("click", grab);
      document.addEventListener("mousedown", grab);
      window.addEventListener("focus", grab);
    </script>
  </body>
</html>
